[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claudecut"
version = "1.0.0"
description = "Open-source intelligent proxy that reduces Anthropic Claude API & Claude Code expenses by 40%+ through automated prompt caching, context minification, and smart model routing."
readme = "README.md"
authors = [{ name = "ClaudeCut Open Source Community" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.3",
]

[project.scripts]
claudecut = "claudecut.cli:main"

[project.urls]
"Homepage" = "https://github.com/open-claudecut/claudecut"
"Bug Tracker" = "https://github.com/open-claudecut/claudecut/issues"
