[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claudecut"
version = "1.0.0"
description = "Drop-in intelligent reverse proxy that automatically slashes Anthropic Claude API & Claude Code expenses by 40% to 70% with automatic prompt caching and task-based model switching."
readme = "README.md"
authors = [{ name = "Rahul Agarwal", email = "rahul@example.com" }]
license = { text = "Source-Available License" }
requires-python = ">=3.10"
keywords = [
    "anthropic",
    "claude",
    "claude-code",
    "claude-3-7-sonnet",
    "claude-3-5-haiku",
    "prompt-caching",
    "cost-optimization",
    "llm-proxy",
    "ai-gateway",
    "finops",
    "cursor-ai",
    "token-optimizer"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.3",
]

[project.scripts]
claudecut = "claudecut.cli:main"

[project.urls]
"Homepage" = "https://github.com/rahulagarwal18/ClaudeCut"
"Repository" = "https://github.com/rahulagarwal18/ClaudeCut"
"Bug Tracker" = "https://github.com/rahulagarwal18/ClaudeCut/issues"
